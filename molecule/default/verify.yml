---
- name: Verify
  hosts: all
  tasks:
    - name: Create the current_release folder
      ansible.builtin.file:
        dest: "{{ item }}"
        state: directory
        owner: proserver
        mode: "0755"
      loop:
        - /var/www
        - /var/www/current

    - name: Template the example Nginx config
      ansible.builtin.template:
        owner: root
        mode: "0644"
        src: nginx/http.d/app.conf
        dest: "/etc/nginx/http.d/app.conf"

    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

    - name: Copy the example PHP script
      ansible.builtin.copy:
        owner: proserver
        mode: "0777"
        src: "index.php"
        dest: "/var/www/current/index.php"

    - name: Test PHP-FPM
      block:
        - name: Check that a page returns successfully but fail if 'Hello PHP {{ ansible_local.php.version }}!' is not in the page contents
          ansible.builtin.uri:
            url: http://localhost
            return_content: true
          register: this
          failed_when: this is failed or ('Hello PHP ' + ansible_local.php.version) not in this.content
      rescue:
        - name: Get nginx error log
          register: nginx_log
          changed_when: no
          ansible.builtin.command:
            cmd: tail -n 10 /var/log/nginx/error.log

        - name: Display the log output
          ansible.builtin.fail:
            msg: "{{ nginx_log.stdout }}"

    - name: Test PHP disabled modules
      become_user: proserver
      become: yes
      register: php_enabled_modules
      changed_when: no
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: source ~/.shrc || true && php -m

    - name: Fail if tokenizer, exif or calendar are enabled
      when: "'tokenizer' in php_enabled_modules.stdout or 'exif' in php_enabled_modules.stdout or 'calendar' in php_enabled_modules.stdout"
      ansible.builtin.fail:
        msg: "tokenizer, exif or calendar are still enabled!"

    - name: Test PHP modules with the default CLI configuration
      register: php_default_modules
      changed_when: no
      ansible.builtin.command:
        cmd: php -m
      environment:
        PHP_INI_SCAN_DIR: "{{ ansible_local.php.prefix.modules }}"

    - name: Fail if calendar is not enabled with the default CLI configuration
      when: "'calendar' not in php_default_modules.stdout"
      ansible.builtin.fail:
        msg: "calendar is disabled outside the CLI-specific module directory!"

    - name: List the module ini files in the CLI-specific module directory
      ansible.builtin.find:
        paths: "{{ ansible_local.php.prefix.modules }}-cli"
        patterns: "*.ini,*.ini.off"
        file_type: any
      register: php_cli_module_files

    - name: Fail if a disabled module has an active ini file or no .ini.off in the CLI-specific module directory
      vars:
        php_cli_module_names: "{{ php_cli_module_files.files | map(attribute='path') | map('basename') | list }}"
      loop:
        - calendar
        - exif
        - tokenizer
      when: >-
        php_cli_module_names | select('match', '^(ext-)?[0-9]{2}-' + item + '\\.ini$') | list | length > 0
        or php_cli_module_names | select('match', '^(ext-)?[0-9]{2}-' + item + '\\.ini\\.off$') | list | length == 0
      ansible.builtin.fail:
        msg: "{{ item }} must only exist as .ini.off in {{ ansible_local.php.prefix.modules }}-cli, found: {{ php_cli_module_names | select('search', item) | list }}"

    - name: Check that a new PHP extension can be installed from the configured repository
      check_mode: yes
      ansible.builtin.apt:
        name: php{{ ansible_local.php.version }}-gd
