---
- name: Ensure a CLI-specific module directory exists
  when: php.modules.disable.cli | length > 0
  ansible.builtin.file:
    path: "{{ php.prefix.modules }}-cli"
    state: directory
    owner: root
    mode: "0755"
  register: php_cli_modules_folder_created

- name: List all default PHP modules
  ansible.builtin.find:
    paths: "{{ php.prefix.modules }}"
    patterns: "*.ini"
    file_type: "{{ 'link' if ansible_facts['os_family'] == 'Debian' else 'file' }}"
  register: php_default_modules_list

- name: Copy all default modules to the CLI-specific modules directory
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ php.prefix.modules }}-cli/{{ item.path | basename }}"
    owner: root
    mode: "0644"
    remote_src: true
  when: php.modules.disable.cli | length > 0 and php_default_modules_list is defined and php_default_modules_list.files | length > 0
  # Skip the CLI-disabled modules: copying them again on every run would bring back an active .ini next to the .ini.off
  loop: "{{ php_default_modules_list.files | default([]) | rejectattr('path', 'search', php_cli_disabled_pattern) | list }}"
  vars:
    php_cli_disabled_pattern: "/(ext-)?[0-9]{2}-({{ php.modules.disable.cli | map('regex_escape') | join('|') }})\\.ini$"
  loop_control:
    label: "{{ item.path }}"
  ignore_errors: "{{ ansible_check_mode }}"

- name: Check module ini files for all SAPIs
  when: php.modules.disable.all | length > 0
  ansible.builtin.find:
    patterns: "{{ php.modules.disable.all | map('regex_replace', '^', '(ext-)?[0-9]{2}-') | map('regex_replace', '$', '\\.ini(?!\\.off)') }}"
    use_regex: yes
    paths: "{{ php.prefix.modules }}"
    file_type: "{{ 'link' if ansible_facts['os_family'] == 'Debian' else 'file' }}"
  register: all_sapi_stats

- name: Check CLI-specific module ini files
  when: php.modules.disable.cli | length > 0
  ansible.builtin.find:
    patterns: "{{ php.modules.disable.cli | map('regex_replace', '^', '(ext-)?[0-9]{2}-') | map('regex_replace', '$', '\\.ini(?!\\.off)') }}"
    use_regex: yes
    paths: "{{ php.prefix.modules }}-cli"
    file_type: any
  register: cli_specific_stats

# Copy + remove instead of `mv` guarded by `creates: .off`: that guard skipped the rename whenever an .ini reappeared
# (re-copied above, or restored by a package upgrade) next to an existing .ini.off, leaving the module active
- name: Keep a disabled copy of PHP module ini files as .ini.off
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ item.path }}.off"
    remote_src: true
    owner: root
    mode: "0644"
  loop: "{{ ((all_sapi_stats | default({})).files | default([])) + ((cli_specific_stats | default({})).files | default([])) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  ignore_errors: "{{ ansible_check_mode }}"

- name: Disable PHP modules by removing their active ini file
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ ((all_sapi_stats | default({})).files | default([])) + ((cli_specific_stats | default({})).files | default([])) }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Init getent database
  ansible.builtin.getent:
    database: passwd

- name: "Ensure PHP_INI_SCAN_DIR environment variable is set in all shells for all users"
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts.getent_passwd[item.0][4] }}/{{ item.1 }}"
    create: true
    line: "{{ export.command }} PHP_INI_SCAN_DIR{{ export.separator }}{{ php.prefix.modules }}-cli"
    regexp: '^\s*({{ export.command }}\s+)?PHP_INI_SCAN_DIR='
    state: present
    mode: "0644"
    owner: "{{ item.0 }}"
  loop: "{{ php.modules.disable.for_users | product(['.bashrc', '.shrc', '.profile']) | list }}"
  vars:
    export: >-
      {{
        {'command': 'setenv', 'separator': ' '} if item.1 == '.cshrc' else {'command': 'export', 'separator': '=' }
      }}
  loop_control:
    label: "{{ item.0 }} -> {{ item.1 }}"
  when: php.modules.disable.for_users | length > 0 and php.modules.disable.cli | length > 0
