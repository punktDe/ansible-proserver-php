---
- name: Install python3-debian package with apt
  ansible.builtin.apt:
    name: python3-debian
    update_cache: yes

# Up to 4.x the role used the ondrej/php PPA on Ubuntu. Its builds carry a higher version than the packages.sury.org
# builds of the same PHP release, so apt keeps them after the repository switch, and installing a new extension then
# fails on its exact php<version>-common dependency. Detect them before the repository is switched, so a host that is
# not meant to be migrated yet stays untouched (also in check mode). See "Migrating from the ondrej/php PPA" in the README.
- name: Find installed PHP packages from the ondrej/php PPA
  when:
    - php.repository.apt.enabled
    - ansible_facts['distribution'] == 'Ubuntu'
  changed_when: no
  check_mode: no
  register: php_ppa_packages
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -o pipefail
      dpkg-query -W -f='${db:Status-Abbrev} ${Package} ${Version}\n' 'php*' | awk '$1 ~ /^[hi]i/ {print $2, $3}' |
      while read -r package installed; do
        # The installed version comes from the PPA, or from no repository at all (PPA already removed)
        apt-cache policy "$package" | awk -v installed="$installed" '
          /^ (\*\*\*|   ) [^ ]/ { version = ($1 == "***") ? $2 : $1; current = (version == installed); next }
          current && /^        / && $2 != "/var/lib/dpkg/status" {
            repositories++
            if (index($2, "ppa.launchpad") && index($2, "/ondrej/php")) ppa = 1
          }
          END { exit !(ppa || repositories == 0) }' && echo "$package"
      done || true

- name: Fail if PHP packages need to be migrated from the ondrej/php PPA
  when:
    - php.repository.apt.enabled
    - php_ppa_packages.stdout_lines | default([]) | length > 0
    - not php.repository.apt.migrate_from_ppa
  ansible.builtin.fail:
    msg: >-
      These PHP packages are installed from the ondrej/php PPA (used on Ubuntu up to version 4.x of this role), or
      from no repository at all: {{ php_ppa_packages.stdout_lines | join(', ') }}.
      Nothing has been changed. Set php.repository.apt.migrate_from_ppa to true to switch them to
      {{ php.repository.apt.repository }} (see "Migrating from the ondrej/php PPA" in the README of this role).

- name: Show the PHP packages that will be switched from the ondrej/php PPA
  when:
    - php.repository.apt.enabled
    - php_ppa_packages.stdout_lines | default([]) | length > 0
  ansible.builtin.debug:
    msg: "Switching to {{ php.repository.apt.repository }}: {{ php_ppa_packages.stdout_lines | join(', ') }}"

- name: Remove the legacy apt repository
  when: php.repository.apt.enabled
  ansible.builtin.file:
    dest: /etc/apt/sources.list.d/php.list
    state: absent

- name: Ensure the third-party PHP repository is {{ 'present' if php.repository.apt.enabled else 'absent' }}
  changed_when: "'molecule-idempotence-notest' not in ansible_skip_tags"
  register: php_repository_added
  ansible.builtin.deb822_repository:
    name: php
    uris: "{{ php.repository.apt.repository }}"
    signed_by: "{{ php.repository.apt.key_url }}"
    types: [deb]
    components: [main]
    suites: "{{ ansible_facts['distribution_release'] }}"
    state: "{{ 'present' if php.repository.apt.enabled else 'absent' }}"
    enabled: "{{ php.repository.apt.enabled }}"

- name: Update apt cache (Debian-based)
  when: php_repository_added.changed
  changed_when: no
  ansible.builtin.apt:
    update_cache: yes

- name: Reload facts
  when: php_repository_added.changed
  check_mode: no
  changed_when: no
  ansible.builtin.setup: {}

- name: Find the versions of the PPA packages in the configured repository
  when:
    - php.repository.apt.enabled
    - php_ppa_packages.stdout_lines | default([]) | length > 0
  changed_when: no
  check_mode: no
  register: php_packages_to_migrate
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      for package in {{ php_ppa_packages.stdout_lines | map('quote') | join(' ') }}; do
        version=$(apt-cache madison "$package" | awk -F' [|] ' \
          -v repository="{{ php.repository.apt.repository | regex_replace('/$', '') }}" \
          'index($3, repository) {print $2; exit}')
        [ -n "$version" ] && echo "${package}=${version}"
      done || true

- name: Switch all affected PHP packages to the configured repository in one transaction
  when:
    - php.repository.apt.enabled
    - php_packages_to_migrate.stdout_lines | default([]) | length > 0
  notify: Restart PHP-FPM
  ansible.builtin.apt:
    name: "{{ php_packages_to_migrate.stdout_lines }}"
    allow_downgrade: yes
