---
- name: Set the PHP facts
  ansible.builtin.include_tasks: php_fact.yaml

- name: Manage apt repo (Ubuntu/Debian)
  when: ansible_os_family == 'Debian'
  ansible.builtin.include_tasks: apt.yaml

- name: Install PHP and extensions (Ubuntu/Debian)
  when: ansible_os_family == 'Debian'
  ansible.builtin.include_tasks: install.yaml

- name: Set up phpfpmtop
  ansible.builtin.include_tasks: phpfpmtop.yaml

- name: Configure PHP-FPM
  ansible.builtin.include_tasks: phpfpm.yaml

- name: Configure PHP
  ansible.builtin.include_tasks: php.yaml

- name: Disable php-modules
  ansible.builtin.include_tasks: disable_modules.yaml
  when: php.modules.disable.all | length > 0 or php.modules.disable.cli | length > 0

- name: Fail if LD_BIND_NOW for the PHP CLI is enabled on a system other than FreeBSD
  ansible.builtin.fail:
    msg: "php.cli.ld_bind_now only works on FreeBSD (login.conf), this host runs {{ ansible_os_family }}"
  when: php.cli.ld_bind_now.enabled and ansible_os_family != 'FreeBSD'

- name: Manage LD_BIND_NOW for the PHP CLI (FreeBSD)
  ansible.builtin.include_tasks: cli_ld_bind_now.yaml
  when: ansible_os_family == 'FreeBSD' and php.cli.ld_bind_now.for_users | length > 0
